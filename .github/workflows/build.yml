name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  go:
    name: Go tests and release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build all commands
        run: go build ./...

      - name: Cross-build release targets
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh tests/install.sh

      - name: Test installer
        run: tests/install.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Build documentation
        env:
          FIBEL_SITE_URL: https://docs.example.test
          FIBEL_AI_PROVIDER: ollama
          FIBEL_AI_MODEL: release-smoke
        run: bun run docs:build

      - name: Check documentation routes and links
        env:
          FIBEL_SITE_URL: https://docs.example.test
          FIBEL_AI_PROVIDER: ollama
          FIBEL_AI_MODEL: release-smoke
        run: bun run docs:check

      - name: Build documentation container
        run: docker build --file deploy/docs/Dockerfile --tag pulse-injestors-docs:test .

      - name: Smoke-test documentation container
        run: |
          set -euo pipefail
          container_id=$(
            docker run --detach --rm \
              --name pulse-injestors-docs-smoke \
              --env FIBEL_SITE_URL=https://docs.example.test \
              --env FIBEL_AI_PROVIDER=ollama \
              --env FIBEL_AI_MODEL=release-smoke \
              --publish 127.0.0.1:18081:3000 \
              --read-only \
              --tmpfs /tmp \
              pulse-injestors-docs:test
          )
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/en >/tmp/pulse-docs-home.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          grep --fixed-strings --quiet \
            'https://impressum.valentin-kolb.com' \
            /tmp/pulse-docs-home.html
          grep --fixed-strings --quiet \
            'data-fibel-assistant-open' \
            /tmp/pulse-docs-home.html
          grep --fixed-strings --quiet \
            'data-fibel-mcp-open' \
            /tmp/pulse-docs-home.html
          curl --fail --silent http://127.0.0.1:18081/sitemap.xml |
            grep --fixed-strings --quiet \
              '<loc>https://docs.example.test/en</loc>'

  images:
    name: Image (${{ matrix.name }})
    needs: [go, installer, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pulse-docker
            file: Dockerfile
            image: ghcr.io/valentinkolb/pulse-docker
          - name: documentation
            file: deploy/docs/Dockerfile
            image: ghcr.io/valentinkolb/pulse-injestors-docs
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'

      - name: Sign image
        if: github.event_name == 'push'
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
