[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
# One line with the source token, mode 0600. Under systemd the service
# loads it as a credential instead; see the installation guide.
ingest_token_file = "/Users/your-user/Library/Application Support/Pulse/pulse-macos.token"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/Users/your-user/Library/Application Support/Pulse/pulse-macos-spool"
spool_max_bytes = 67108864

[resource]
id = "macbook-1"
label = "MacBook 1"
type = "host"

[dimensions]
environment = "production"

# Workstations: one source per machine, Expected data = daily (expectDailyBy).
# macOS always uses workstation cadences; there is no profile flag.
[runner]
interval_seconds = 300
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[macos]
enable_homebrew = true
homebrew_timeout_seconds = 20
enable_software_update = true
software_update_timeout_seconds = 60
