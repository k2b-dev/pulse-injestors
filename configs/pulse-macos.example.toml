[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
ingest_token = "replace-me"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/Users/your-user/Library/Application Support/Pulse/outbox"
spool_max_bytes = 67108864

[resource]
id = "macbook-1"
label = "MacBook 1"
type = "host"

[dimensions]
environment = "production"

[runner]
interval_seconds = 300
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[macos]
enable_homebrew = true
homebrew_timeout_seconds = 20
enable_software_update = false
software_update_timeout_seconds = 60
enable_system_profiler = true
system_profiler_timeout_seconds = 10
