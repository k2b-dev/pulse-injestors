[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
# One line with the source token, mode 0600. Under systemd the service
# loads it as a credential instead; see the installation guide.
ingest_token_file = "/run/secrets/pulse-ingest-token"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/var/lib/pulse/pulse-docker"
spool_max_bytes = 67108864

[resource]
# Stable monitored host id and display label. Do not use the ingestor container id.
# pulse-docker derives host, daemon, logical container, Compose, image, and
# filesystem resources from this host identity.
id = "server-01"
label = "server-01"
type = "host"

[dimensions]
environment = "production"

[runner]
interval_seconds = 60
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[host]
proc_root = "/host/proc"
sys_root = "/host/sys"
root = "/host/root"
cpu_sample_ms = 250
enable_thermal = true
enable_btrfs = true
enable_zfs = true

[docker]
socket_path = "/var/run/docker.sock"
host_root = "/host/root"
concurrency = 4
container_timeout_seconds = 10
enable_registry_checks = false
registry_timeout_seconds = 10

[[script]]
name = "site-labels"
command = ["/etc/pulse/scripts/site-labels.sh"]
timeout_seconds = 5
max_output_bytes = 1048576

[script.dimensions]
source = "local-script"
