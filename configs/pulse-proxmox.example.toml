# Install pulse-linux separately on this host with [linux] profile = "proxmox-node".
# Host CPU, RAM, disks, SMART, packages and services come from pulse-linux.
[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
# One line with the source token, mode 0600. Under systemd the service
# loads it as a credential instead; see the installation guide.
ingest_token_file = "/etc/pulse/pulse-proxmox.token"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/var/lib/pulse/pulse-proxmox"
spool_max_bytes = 67108864

[resource]
# Stable host ID. The API local-node flag identifies the PVE node.
id = "pve-node-1"
label = "pve-node-1"
type = "proxmox-node"

[dimensions]
environment = "production"

# Health 60 s, guests/storage 300 s, backups 900 s, versions 86400 s.
[runner]
interval_seconds = 60
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[proxmox]
pvesh_path = "pvesh"
timeout_seconds = 10
# Backup content / namespace / group / snapshot lists. Must be positive.
list_timeout_seconds = 60
enable_ceph_api = true
