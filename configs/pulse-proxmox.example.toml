[pulse]
ingest_url = "https://pulse.example.com/ingest/source"
ingest_token = "replace-me"

[entity]
id = "pve-cluster-1"
type = "proxmox-cluster"

[runner]
interval_seconds = 60
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[proxmox]
api_url = "https://pve.example.com:8006"
api_token = "root@pam!pulse=replace-me"
timeout_seconds = 10
insecure_skip_verify = false
enable_ceph_api = false
enable_local_ceph = false
