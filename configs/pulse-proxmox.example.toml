[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
ingest_token = "replace-me"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/var/lib/pulse/pulse-proxmox"
spool_max_bytes = 67108864

[resource]
# Stable host id. Proxmox, Ceph, and host-resource resource IDs are derived from it.
id = "pve-node-1"
label = "pve-node-1"
type = "host"

[dimensions]
environment = "production"

[runner]
interval_seconds = 60
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[host]
proc_root = "/proc"
sys_root = "/sys"
root = "/"
cpu_sample_ms = 250
enable_thermal = true
enable_btrfs = true
enable_zfs = true
enable_ceph = true

[linux]
profile = "proxmox"
systemd_units = []
package_timeout_seconds = 20
disk_health_timeout_seconds = 20

[proxmox]
pvesh_path = "pvesh"
timeout_seconds = 10
enable_ceph_api = true
enable_local_ceph = true
