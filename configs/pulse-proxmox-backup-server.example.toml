# Install pulse-linux separately on this host with [linux] profile = "pbs".
# Host CPU, RAM, disks, SMART, packages and services come from pulse-linux.
[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
# One line with the source token, mode 0600. Under systemd the service
# loads it as a credential instead; see the installation guide.
ingest_token_file = "/etc/pulse/pulse-proxmox-backup-server.token"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/var/lib/pulse/pulse-proxmox-backup-server"
spool_max_bytes = 67108864

[resource]
# Stable host ID. Datastore, job and backup-group IDs are derived from it.
id = "pbs-1"
label = "pbs-1"
type = "proxmox-backup-server"

[dimensions]
environment = "production"

# Datastores 300 s, jobs/groups 900 s, versions 86400 s.
[runner]
interval_seconds = 60
collector_timeout_seconds = 60 # Other phases; groups use their own budget below.

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[pbs]
command_path = "proxmox-backup-debug"
timeout_seconds = 10
# Namespace and group lists, per call. Must be positive.
list_timeout_seconds = 120
# Whole groups phase; overrides runner collector timeout. Must be positive.
groups_timeout_seconds = 300
# Mark old groups, including retained backups of deleted guests. Must be positive.
stale_after_hours = 168
