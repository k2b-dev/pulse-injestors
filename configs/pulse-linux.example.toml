[pulse]
ingest_url = "https://pulse.example.com/ingest/source"
ingest_token = "replace-me"

[entity]
id = "linux-host-1"
label = "linux-host-1"
type = "host"

[dimensions]
environment = "production"

[runner]
interval_seconds = 60
collector_timeout_seconds = 60

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[host]
proc_root = "/proc"
sys_root = "/sys"
root = "/"
cpu_sample_ms = 250
enable_thermal = true
enable_btrfs = true
enable_zfs = true
enable_ceph = true

[linux]
profile = "docker-host"
systemd_units = ["ssh.service", "docker.service"]
package_timeout_seconds = 20
disk_health_timeout_seconds = 20
