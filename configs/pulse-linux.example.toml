[pulse]
ingest_url = "https://pulse.example.com/api/pulse/ingest"
# One line with the source token, mode 0600. Under systemd the service
# loads it as a credential instead; see the installation guide.
ingest_token_file = "/etc/pulse/pulse-linux.token"
# Explicit 64 MiB disk budget; size for measured output and tolerated outage.
spool_dir = "/var/lib/pulse/pulse-linux"
spool_max_bytes = 67108864

[resource]
id = "linux-host-1"
label = "linux-host-1"
type = "host"

[dimensions]
environment = "production"

[runner]
interval_seconds = 300
collector_timeout_seconds = 60

# Optional overrides by collector name, in seconds; each must be >= interval_seconds.
# [runner.cadence]
# filesystem = 600
# network = 600
# inventory = 86400
# "script:custom" = 300

[http]
timeout_seconds = 10
max_retries = 3
initial_backoff_ms = 500

[host]
proc_root = "/proc"
sys_root = "/sys"
root = "/"
cpu_sample_ms = 250
enable_thermal = true
enable_btrfs = true
enable_zfs = true
# Proxmox Ceph is collected once by the elected pulse-proxmox node.
enable_ceph = false

[linux]
# Workstation preset: health 300 s, capacity 900 s, packages hourly, inventory/posture daily.
# One source per machine; set Expected data = daily (expectDailyBy) in Pulse.
# Server deployments can use profile = "server" with interval_seconds = 60.
profile = "desktop"
systemd_units = []
package_timeout_seconds = 20
disk_health_timeout_seconds = 20
# Local PEM certificate paths/globs; empty by default.
# certificate_paths = ["/etc/ssl/local/*.pem"]
# Replace the complete default exclusion list. [] includes all interfaces.
# network_exclude = ["lo", "veth*", "docker*", "br-*", "virbr*", "cni*", "flannel*", "cali*", "vxlan*", "tap*", "fwbr*", "fwpr*", "fwln*", "kube-*", "cilium*", "lxc*"]

# A marker's modification time records the last successful backup.
# [[backup]]
# name = "database"
# marker_file = "/var/lib/backup/database.ok"

# Alternatively, a command prints RFC3339 or Unix seconds (30 s, 4 KiB max).
# [[backup]]
# name = "offsite"
# command = ["/usr/local/bin/backup-last-success", "offsite"]

# [[script]]
# name = "custom"
# command = ["/usr/local/bin/pulse-custom"]
# cadence_seconds = 300 # omitted: runner interval

# Native service probes are disabled unless their section exists.
# Each group has a 10 s timeout and 1 MiB response limit.
# Profiles only add systemd checks: postgres, pg-edge, nats, nats-edge,
# valkey, clickhouse. Set linux.profile above for this VM.
# Cadence names: patroni=60, postgres=300, postgres-version=86400,
# nats=60, nats-jetstream=300, nats-version=86400,
# valkey=60, valkey-capacity=300, valkey-version=86400,
# clickhouse=60, clickhouse-capacity=300, clickhouse-version=86400.
# Put cadence overrides in [runner.cadence] above.

# [patroni]
# url = "https://127.0.0.1:8008"
# server_name = "patroni.example.test"
# ca_file = "/etc/pulse/service-ca.pem"
# insecure_skip_verify = false
# cluster = "database" # Optional: defaults to /patroni patroni.scope.
# username = "monitor" # Optional; requires password_file.
# password_file = "/etc/pulse/patroni.password"

# [postgres]
# command = ["runuser", "-u", "postgres", "--", "psql"]
# database = "postgres"

# [nats]
# monitor_url = "http://127.0.0.1:8222"

# [valkey]
# address = "127.0.0.1:6379" # Use the local TLS port.
# tls = true
# server_name = "valkey.example.test"
# ca_file = "/etc/pulse/service-ca.pem"
# password_file = "/etc/pulse/valkey.password"
# username = "monitor" # Optional ACL username.

# Monitoring user: readonly profile with max_execution_time <= 10 seconds.
# Password-bearing HTTP requests require loopback; use HTTPS otherwise.
# [clickhouse]
# url = "https://127.0.0.1:8443"
# user = "monitor"
# password_file = "/etc/pulse/clickhouse.password"
# ca_file = "/etc/pulse/service-ca.pem"
# server_name = "clickhouse.example.test"
